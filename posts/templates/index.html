{% extends "base.html" %}

{% block title %}Postes{% endblock title %}

{% block body %}

    <h1 class="title"> {% block brandtitle %}All your post{% endblock brandtitle %} </h1>

    <div class="posts">
        {% for post in posts %}
            <div class="post">
                <div class="post-header">
                    {% if post.image %}
                        <img src="{{ post.image.url }}" alt="">
                    {% endif %}
                </div>
                <div class="post-body">
                    <h3>{{ post.title }}</h3>
                    <p>{{ post.content }}</p>
                    <div>
                        <a href="" class="edit">Modifier</a>
                        <a href="" class="delete">Supprimer</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock body %}
